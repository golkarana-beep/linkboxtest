<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارسال فایل به LinkBox</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="file-manager.css"><style>body{min-height:100vh;display:grid;place-items:center}.receive-card{width:min(620px,calc(100% - 28px));padding:28px;border:1px solid var(--border-color,#ddd);border-radius:22px;background:var(--card-bg,#fff);box-shadow:0 18px 55px #0001}.receive-drop{display:block;text-align:center;border:2px dashed #8795ce;border-radius:16px;padding:38px 15px;margin:20px 0;cursor:pointer}.receive-drop strong{display:block;font-size:18px;margin-bottom:8px}.receive-status{font-size:13px;line-height:1.9;min-height:28px}</style></head><body><main class="receive-card"><p class="fm-kicker">LINKBOX SECURE TRANSFER</p><h2>ارسال فایل</h2><p>فایل‌های انتخاب‌شده مستقیماً به فضای ابری LinkBox ارسال می‌شوند.</p><label class="receive-drop"><strong>＋ انتخاب فایل یا فایل‌ها</strong><span>برای فایل‌های بزرگ، بارگذاری قطعه‌ای انجام می‌شود.</span><input id="receive-files" type="file" multiple hidden></label><div class="fm-progress-wrap"><div class="fm-progress-label"><span id="receive-name">آماده دریافت فایل</span><span id="receive-percent">0%</span></div><div class="fm-progress"><i id="receive-bar"></i></div></div><p id="receive-status" class="receive-status" aria-live="polite"></p><p class="fm-footer-note">این لینک ممکن است پس از تاریخ انقضا غیرفعال شود. فایل‌های ارسال‌شده در آرشیو مدیر قرار می‌گیرند.</p></main><script src="config.js"></script><script src="receive.js"></script></body></html>
